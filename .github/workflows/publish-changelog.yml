name: Publish verified changelog updates

on:
  workflow_run:
    workflows:
      - Retainr changelog bot
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-changelog
  cancel-in-progress: false

jobs:
  verify-and-merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Find the bot pull request
        id: changelog-pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pull_requests="$(gh pr list --repo "$GH_REPO" --state open --head automation/changelog --base main --json number,title,isDraft,headRefName,baseRefName)"
          count="$(jq 'length' <<<"$pull_requests")"

          if [[ "$count" == "0" ]]; then
            echo "No changelog pull request needs publishing."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$count" != "1" ]]; then
            echo "Expected one changelog pull request, found $count." >&2
            exit 1
          fi

          title="$(jq -r '.[0].title' <<<"$pull_requests")"
          draft="$(jq -r '.[0].isDraft' <<<"$pull_requests")"
          head="$(jq -r '.[0].headRefName' <<<"$pull_requests")"
          base="$(jq -r '.[0].baseRefName' <<<"$pull_requests")"

          [[ "$title" == "[changelog] Update Retainr changelog"* ]] || {
            echo "Unexpected changelog pull request title: $title" >&2
            exit 1
          }
          [[ "$draft" == "false" && "$head" == "automation/changelog" && "$base" == "main" ]] || {
            echo "Changelog pull request does not match the publishing policy." >&2
            exit 1
          }

          number="$(jq -r '.[0].number' <<<"$pull_requests")"
          changed_files="$(gh pr view "$number" --repo "$GH_REPO" --json files --jq '.files[].path')"
          [[ "$changed_files" == "src/data/changelog.ts" ]] || {
            echo "The changelog bot changed files outside its data file:" >&2
            printf '%s\n' "$changed_files" >&2
            exit 1
          }

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Check out the proposed changelog
        if: ${{ steps.changelog-pr.outputs.found == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ steps.changelog-pr.outputs.number }}/head

      - name: Set up Node
        if: ${{ steps.changelog-pr.outputs.found == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Verify the complete website
        if: ${{ steps.changelog-pr.outputs.found == 'true' }}
        run: |
          npm ci
          npm run build:ci

      - name: Publish the changelog update
        if: ${{ steps.changelog-pr.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.changelog-pr.outputs.number }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --squash --delete-branch --subject "Update Retainr changelog"
